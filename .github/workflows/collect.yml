name: Daily Collect & Deep Verify Proxies

on:
  schedule:
    # 每天北京时间 19:10 (UTC 10:00) 自动定时执行
    - cron: '10 11 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install sing-box (Linux)
        run: |
          echo "Downloading official sing-box Linux release..."
          curl -sLo sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v1.11.4/sing-box-1.11.4-linux-amd64.tar.gz"
          tar -xzf sing-box.tar.gz --strip-components=1
          chmod +x sing-box
          sudo mv sing-box /usr/local/bin/
          echo "sing-box installed successfully:"
          sing-box version

      - name: Run Collector & sing-box Deep Verifier
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python collector.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add all_proxies*.txt seen_hashes.txt valid_proxies*.txt final_valid_proxies*.txt
          git diff --cached --quiet || git commit -m "chore: daily 19:10 collect and 204 deep-verified proxies [skip ci]"
          git push origin main
